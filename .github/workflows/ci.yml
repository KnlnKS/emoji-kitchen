name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  EK_DATA: ${{ github.workspace }}/build/ek-data
  BUNDLETOOL: 1.18.3

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Check signing secrets are set
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing="${missing} ${name}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::Cannot publish a release without signing secrets. Missing:${missing}. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download packs
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          patterns=(--pattern kitchen-mini.pak)
          if [ "$FULL" = true ]; then patterns+=(--pattern kitchen.pak); fi
          gh release download pack --repo "$GITHUB_REPOSITORY" --dir "$EK_DATA/out" "${patterns[@]}"
          ls -lh "$EK_DATA/out"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        if: github.ref != 'refs/heads/main'
        run: ./gradlew :app:assembleDebug

      - name: Build release bundle
        if: github.ref == 'refs/heads/main'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')

          properties = {
              'storeFile': f"{os.environ['RUNNER_TEMP']}/release.jks",
              'storePassword': os.environ['KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          Path('keystore.properties').write_text(''.join(f'{key}={escape(value)}\n' for key, value in properties.items()))
          PY
          ./gradlew :app:bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/bundle-signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/bundle-signature.txt"

      - name: Build universal APK
        if: github.ref == 'refs/heads/main'
        id: apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="1.0.${GITHUB_RUN_NUMBER}"
          apk="dist/emoji-kitchen-v${version}.apk"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL}/bundletool-all-${BUNDLETOOL}.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --output "$RUNNER_TEMP/app.apks" \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD"
          mkdir -p dist
          unzip -p "$RUNNER_TEMP/app.apks" universal.apk > "$apk"
          if ! unzip -v "$apk" assets/kitchen.pak | grep ' Stored ' > /dev/null; then
            echo "::error::assets/kitchen.pak is missing from the APK or compressed, so it can't be memory-mapped."
            exit 1
          fi
          ls -lh dist/
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload Play release bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: play-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Remove signing credentials
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/testDebugUnitTest'
          retention-days: 14
          if-no-files-found: ignore

  publish-play:
    name: Publish to Google Play
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check Google Play credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Set the PLAY_SERVICE_ACCOUNT_JSON repository secret after granting the service account release access to Emoji Kitchen in Play Console."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: play-release
          path: play-release

      - name: Release to production
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kunalan.emojikitchen
          releaseFiles: play-release/bundle/release/app-release.aab
          mappingFile: play-release/mapping/release/mapping.txt
          tracks: production
          status: completed
          releaseName: '1.0.${{ github.run_number }}'
          changesNotSentForReview: false
