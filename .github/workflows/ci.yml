name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  EK_DATA: ${{ github.workspace }}/build/ek-data
  BUNDLETOOL: 1.18.3

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are set
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing="${missing} ${name}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::Cannot publish a release without signing secrets. Missing:${missing}. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download packs
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          patterns=(--pattern kitchen-mini.pak)
          if [ "$FULL" = true ]; then patterns+=(--pattern kitchen.pak); fi
          gh release download pack --repo "$GITHUB_REPOSITORY" --dir "$EK_DATA/out" "${patterns[@]}"
          ls -lh "$EK_DATA/out"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        if: github.ref != 'refs/heads/main'
        run: ./gradlew :app:assembleDebug

      - name: Build release bundle
        if: github.ref == 'refs/heads/main'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease

      - name: Build universal APK
        if: github.ref == 'refs/heads/main'
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="1.0.${GITHUB_RUN_NUMBER}"
          apk="dist/emoji-kitchen-v${version}.apk"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL}/bundletool-all-${BUNDLETOOL}.jar"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --mode=universal \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --output "$RUNNER_TEMP/app.apks" \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD"
          mkdir -p dist
          unzip -p "$RUNNER_TEMP/app.apks" universal.apk > "$apk"
          if ! unzip -v "$apk" assets/kitchen.pak | grep ' Stored ' > /dev/null; then
            echo "::error::assets/kitchen.pak is missing from the APK or compressed, so it can't be memory-mapped."
            exit 1
          fi
          ls -lh dist/
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/testDebugUnitTest'
          retention-days: 14
          if-no-files-found: ignore
